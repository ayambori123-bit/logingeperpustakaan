<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Perpustakaan</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f766e, #2563eb);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Kotak utama */
.login-container {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 35px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    text-align: center;
}

/* Logo */
.logo {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    margin-bottom: 15px;
}

h1 {
    color: #1e293b;
    font-size: 28px;
    margin-bottom: 5px;
}

.subtitle {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
}

/* Input */
.input-box {
    text-align: left;
    margin-bottom: 18px;
}

.input-box label {
    display: block;
    margin-bottom: 7px;
    color: #334155;
    font-weight: bold;
    font-size: 14px;
}

.input-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

.input-box input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
}

/* Tombol */
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

/* Loading */
#loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.97);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.loader {
    width: 55px;
    height: 55px;
    border: 6px solid #e2e8f0;
    border-top: 6px solid #2563eb;
    border-radius: 50%;
    animation: putar 1s linear infinite;
}

.loading-text {
    margin-top: 18px;
    color: #334155;
    font-weight: bold;
}

@keyframes putar {
    100% {
        transform: rotate(360deg);
    }
}

/* Pesan error */
#error {
    display: none;
    color: #dc2626;
    font-size: 14px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<!-- HALAMAN LOGIN -->
<div class="login-container">

    <div class="logo">
        📚
    </div>

    <h1>E-Perpustakaan</h1>

    <p class="subtitle">
        Sistem Informasi Perpustakaan Digital
    </p>

    <div id="error">
        Username atau password salah.
    </div>

    <div class="input-box">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username">
    </div>

    <div class="input-box">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
    </div>

    <button onclick="login()">
        🔐 MASUK
    </button>

</div>


<!-- LOADING -->
<div id="loading">

    <div class="loader"></div>

    <div class="loading-text">
        Memuat e-perpusdamanokwari
    </div>

</div>


<script>

function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    /*
    USERNAME DAN PASSWORD
    Silakan ubah sesuai kebutuhan
    */

    if (username === "admin" && password === "12345") {

        // tampilkan loading
        document.getElementById("loading").style.display = "flex";

        // tunggu 2 detik kemudian masuk
        setTimeout(function() {

            /*
           https://sites.google.com/view/
e-perpusdamanokwari
            */

            window.location.href =
            "https://sites.google.com/view/e-perpusdamanokwari/home";

        }, 2000);

    } else {

        document.getElementById("error").style.display = "block";

    }

}

</script>

</body>
</html>
